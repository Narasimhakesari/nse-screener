name: 20-year test
on:
  workflow_dispatch:
  push:
    paths:
      - 'build/backtest_20y.py'
      - 'build/adjust.py'
      - '.github/workflows/longtest.yml'
permissions:
  contents: write
concurrency:
  group: longtest
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance
      - name: Restore the recent NSE daily files (kept by the nightly job)
        uses: actions/cache/restore@v4
        with:
          path: wd/bhav
          key: bhav-${{ github.run_id }}
          restore-keys: bhav-
      - name: Restore the older NSE daily files (2006 onward)
        uses: actions/cache/restore@v4
        with:
          path: wd/bhav20
          key: bhav20-${{ github.run_id }}
          restore-keys: bhav20-
      - name: Download, adjust and test
        run: |
          mkdir -p wd
          set -o pipefail
          SPLITS_FILE=splits20.json python build/backtest_20y.py wd 2>&1 | grep -v Warning | tee long_log.txt
          cp wd/long_bt.json long_bt.json
      - name: Keep the older files for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: wd/bhav20
          key: bhav20-${{ github.run_id }}
      - name: Commit the results
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          for f in long_log.txt long_bt.json splits20.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "20-year test results"
          git pull --rebase origin main
          git push
