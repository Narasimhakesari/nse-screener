name: Refresh screener data
on:
  # Paused on 19 Nov 2026: the trading rule failed a 20-year test (see long_log.txt). Re-enable by restoring:
  # schedule:
  #   - cron: '7 15 * * 1-5'   # 8:37 pm IST, Monday to Friday
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance
      - name: Restore cached NSE daily files (about 5 years, used for seasonality)
        uses: actions/cache@v4
        with:
          path: wd/bhav
          key: bhav-${{ github.run_id }}
          restore-keys: bhav-
      - name: Rebuild prices and scores
        run: |
          mkdir -p wd
          DUMP=1 python build/build.py wd | tee summary.txt
      - name: Check the result before publishing
        run: |
          python - <<'PY'
          import json
          s=json.loads(open('summary.txt').read().strip().splitlines()[-1])
          assert s['files']>=300 and 700<=s['stocks']<=1600 and 1<s['breadth']<99 and len(s['top5'])==5, s
          PY
          cp wd/data.json data.json
      - name: Re-run the style backtest on the latest data
        continue-on-error: true
        run: |
          python build/backtest_styles.py wd && cp wd/styles_bt.json styles_bt.json
          python build/backtest_algos.py wd > /dev/null && cp wd/algos_bt.json algos_bt.json
          python build/backtest_exits.py wd && cp wd/exits_bt.json exits_bt.json
          python build/backtest_ideas.py wd > /dev/null && cp wd/ideas_bt.json ideas_bt.json
      - name: Fetch news headlines and company numbers for the top-ranked stocks
        continue-on-error: true
        timeout-minutes: 35
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: add this secret to have Claude write the summaries
        run: python build/news_fund.py
      - name: Record trades and send alerts
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python build/notify.py
      - name: Commit new data
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data.json
          for f in auto.json styles_bt.json algos_bt.json exits_bt.json ideas_bt.json history.json splits.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "Refresh data"
          git pull --rebase origin main
          git push
