name: 20-year test of the home page's top 10
on:
  workflow_dispatch:
  push:
    paths:
      - 'build/backtest_score20.py'
      - '.github/workflows/scoretest.yml'
permissions:
  contents: write
concurrency:
  group: scoretest
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance
      - name: Restore the recent NSE daily files
        uses: actions/cache/restore@v4
        with:
          path: wd/bhav
          key: bhav-${{ github.run_id }}
          restore-keys: bhav-
      - name: Restore the older NSE daily files (2006 onward)
        uses: actions/cache/restore@v4
        with:
          path: wd/bhav20
          key: bhav20-${{ github.run_id }}
          restore-keys: bhav20-
      - name: Test
        run: |
          mkdir -p wd
          set -o pipefail
          SPLITS_FILE=splits20.json python build/backtest_score20.py wd 2>&1 | grep -v Warning | tee score_log.txt
          cp wd/score_bt.json score_bt.json
      - name: Commit the results
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          for f in score_log.txt score_bt.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "20-year test of the home page's top 10"
          git pull --rebase origin main
          git push
